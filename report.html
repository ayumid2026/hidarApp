<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidar - Report Price</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f5f5f5; font-family: system-ui, sans-serif; padding-bottom: 80px; }
    .header { background: #2E7D32; color: white; padding: 16px; border-radius: 0 0 20px 20px; }
    .header h1 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 10px; }
    .header a { color: white; text-decoration: none; font-size: 1.5rem; }
    .form-control, .form-select { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }
    .btn-primary { background: #2E7D32; border: none; border-radius: 10px; padding: 12px; font-weight: bold; width: 100%; color: white; }
    .reward-box { background: #FFF8E1; border: 1px dashed #FFA000; border-radius: 10px; padding: 12px; text-align: center; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; padding: 6px 0; z-index: 100; }
    .bottom-nav a { color: #757575; text-decoration: none; font-size: 0.7rem; text-align: center; flex: 1; padding: 4px 0; }
    .bottom-nav a.active { color: #2E7D32; font-weight: bold; }
    .bottom-nav span { display: block; font-size: 1.2rem; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #e0e0e0; border-top: 3px solid #2E7D32; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; z-index: 999; display: none; }
  </style>
</head>
<body>

<div class="header">
  <div class="container d-flex align-items-center">
    <a href="index.html">←</a>
    <h1>📝 Report Price</h1>
  </div>
</div>

<div class="container mt-3">
  <div id="toast" class="toast"></div>
  <form id="reportForm">
    <div class="mb-3"><label class="form-label">Crop *</label>
      <select class="form-select" id="cropSelect" required>
        <option value="">Select...</option>
        <option value="1">Teff</option><option value="2">Wheat</option><option value="3">Maize</option>
        <option value="4">Coffee</option><option value="5">Sesame</option>
      </select>
    </div>
    <div class="mb-3"><label class="form-label">Grade *</label>
      <select class="form-select" id="gradeSelect" required>
        <option value="Grade 1">Grade 1</option><option value="Grade 2">Grade 2</option><option value="Mixed">Mixed</option>
      </select>
    </div>
    <div class="mb-3"><label class="form-label">Market *</label>
      <select class="form-select" id="marketSelect" required>
        <option value="">Select...</option>
        <option value="1">Adama</option><option value="2">Addis Ababa</option><option value="3">Bahir Dar</option>
        <option value="4">Mekele</option><option value="5">Dire Dawa</option><option value="6">Jimma</option>
        <option value="7">Shashemene</option><option value="8">Hawassa</option>
      </select>
    </div>
    <div class="mb-3"><label class="form-label">Price (ETB per quintal) *</label>
      <input type="number" class="form-control" id="priceInput" placeholder="e.g. 11750" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Price Type</label>
      <div class="d-flex gap-3">
        <div class="form-check"><input class="form-check-input" type="radio" name="priceType" value="farmgate" checked id="farmgate"><label for="farmgate">Farmgate</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="priceType" value="wholesale" id="wholesale"><label for="wholesale">Wholesale</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="priceType" value="retail" id="retail"><label for="retail">Retail</label></div>
      </div>
    </div>
    <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="notesInput" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary" id="submitBtn">
      <span id="submitText">Submit Report</span>
      <span id="submitSpinner" class="loading-spinner" style="display:none;"></span>
    </button>
  </form>
  <div class="reward-box mt-3">⭐ You earn <strong>10 points</strong> per verified report<br /><small>100 points = 1 week Premium</small></div>
  <div class="mt-3"><h6>Your Recent Reports</h6><div id="recentReports"><p class="text-muted small">Loading...</p></div></div>
</div>

<div class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="check.html"><span>🔍</span>Check</a>
  <a href="report.html" class="active"><span>📝</span>Report</a>
  <a href="insights.html"><span>📊</span>Insights</a>
  <a href="profile.html"><span>👤</span>Profile</a>
</div>

<script>
  const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'https://hidar.up.railway.app';

  async function fetchAPI(endpoint, options = {}) {
    const token = localStorage.getItem('access_token');
    const headers = { 'Content-Type': 'application/json', ...(token && { 'Authorization': `Bearer ${token}` }), ...options.headers };
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Request failed'); }
    return res.json();
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = type === 'success' ? '#2E7D32' : '#D32F2F';
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
  }

  async function loadReports() {
    const token = localStorage.getItem('access_token');
    if (!token) { document.getElementById('recentReports').innerHTML = `<p class="text-muted small">Login to track reports.</p>`; return; }
    try {
      const reports = await fetchAPI('/reports');
      if (!reports.length) { document.getElementById('recentReports').innerHTML = `<p class="text-muted small">No reports yet.</p>`; return; }
      document.getElementById('recentReports').innerHTML = `<ul class="list-group">${reports.slice(0, 5).map(r => `<li class="list-group-item d-flex justify-content-between">${r.crop_name} - ${r.market_name} <span class="badge ${r.status === 'verified' ? 'bg-success' : r.status === 'rejected' ? 'bg-danger' : 'bg-warning'}">${r.status}</span></li>`).join('')}</ul>`;
    } catch(e) { document.getElementById('recentReports').innerHTML = `<p class="text-muted small">Error loading.</p>`; }
  }

  document.getElementById('reportForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const token = localStorage.getItem('access_token');
    if (!token) { if (confirm('Login to report prices?')) window.location.href='profile.html'; return; }
    const crop = document.getElementById('cropSelect').value;
    const grade = document.getElementById('gradeSelect').value;
    const market = document.getElementById('marketSelect').value;
    const price = document.getElementById('priceInput').value;
    const priceType = document.querySelector('input[name="priceType"]:checked').value;
    const notes = document.getElementById('notesInput').value;
    if (!crop || !market || !price) { showToast('Fill all required fields.', 'error'); return; }

    const btn = document.getElementById('submitBtn'), text = document.getElementById('submitText'), spinner = document.getElementById('submitSpinner');
    text.textContent = 'Submitting...'; spinner.style.display = 'inline-block'; btn.disabled = true;
    try {
      let lat = null, lng = null;
      if (navigator.geolocation) {
        const pos = await new Promise(r => navigator.geolocation.getCurrentPosition(r, () => r(null)));
        if (pos) { lat = pos.coords.latitude; lng = pos.coords.longitude; }
      }
      await fetchAPI('/reports', {
        method: 'POST',
        body: JSON.stringify({ crop_id: parseInt(crop), market_id: parseInt(market), grade, price_etb: parseFloat(price), price_type: priceType, notes: notes || null, latitude: lat, longitude: lng })
      });
      const points = parseInt(localStorage.getItem('hidar_points') || '0');
      localStorage.setItem('hidar_points', points + 10);
      showToast('✅ Report submitted! +10 points');
      document.getElementById('reportForm').reset();
      document.getElementById('gradeSelect').value = 'Grade 1';
      document.querySelector('input[name="priceType"][value="farmgate"]').checked = true;
      loadReports();
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
    finally { text.textContent = 'Submit Report'; spinner.style.display = 'none'; btn.disabled = false; }
  });

  const params = new URLSearchParams(window.location.search);
  if (params.get('crop')) document.getElementById('cropSelect').value = params.get('crop');
  if (params.get('market')) document.getElementById('marketSelect').value = params.get('market');
  if (params.get('grade')) document.getElementById('gradeSelect').value = params.get('grade');

  document.addEventListener('DOMContentLoaded', loadReports);
</script>
</body>
</html>
