<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidar - Report Price</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f5f5f5; font-family: system-ui, sans-serif; padding-bottom: 80px; }
    .header { background: #2E7D32; color: white; padding: 16px; border-radius: 0 0 20px 20px; }
    .header h1 { font-size: 1.3rem; margin: 0; }
    .back-link { color: white; text-decoration: none; font-size: 1.5rem; }
    .form-control, .form-select { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }
    .btn-primary { background: #2E7D32; border: none; border-radius: 10px; padding: 12px; font-weight: bold; width: 100%; }
    .btn-primary:hover { background: #1B5E20; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .reward-box { background: #FFF8E1; border: 1px dashed #FFA000; border-radius: 10px; padding: 12px; text-align: center; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
    .bottom-nav a { color: #757575; text-decoration: none; font-size: 0.75rem; text-align: center; }
    .bottom-nav a.active { color: #2E7D32; font-weight: bold; }
    .bottom-nav span { display: block; font-size: 1.25rem; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2E7D32; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .toast-message { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; z-index: 999; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="container d-flex align-items-center">
      <a href="index.html" class="back-link me-2">←</a>
      <h1>📝 Report Price</h1>
    </div>
  </div>

  <div class="container mt-3">

    <!-- Toast message -->
    <div id="toast" class="toast-message"></div>

    <form id="reportForm">
      <div class="mb-3">
        <label class="form-label">Crop *</label>
        <select class="form-select" id="cropSelect" required>
          <option value="">Select crop...</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Grade *</label>
        <select class="form-select" id="gradeSelect" required>
          <option value="Grade 1">Grade 1</option>
          <option value="Grade 2">Grade 2</option>
          <option value="Mixed">Mixed</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Market *</label>
        <select class="form-select" id="marketSelect" required>
          <option value="">Select market...</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Price (ETB per quintal) *</label>
        <input type="number" class="form-control" id="priceInput" placeholder="e.g., 11750" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Price Type</label>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="priceType" id="farmgate" value="farmgate" checked>
            <label class="form-check-label" for="farmgate">Farmgate</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="priceType" id="wholesale" value="wholesale">
            <label class="form-check-label" for="wholesale">Wholesale</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="priceType" id="retail" value="retail">
            <label class="form-check-label" for="retail">Retail</label>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Photo (optional)</label>
        <input type="file" class="form-control" id="photoInput" accept="image/*">
        <small class="text-muted">Helps verify your report</small>
      </div>

      <div class="mb-3">
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control" id="notesInput" rows="2" placeholder="e.g., Bulk discount, quality issues"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        <span id="submitText">Submit Report</span>
        <span id="submitSpinner" class="loading-spinner" style="display:none;"></span>
      </button>
    </form>

    <div class="reward-box mt-3">
      ⭐ You earn <strong>10 points</strong> per verified report<br>
      <small>100 points = 1 week of Premium access</small>
      <div id="userPoints" class="mt-2"><strong>Your points: <span id="pointsCount">0</span></strong></div>
    </div>

    <div class="mt-3">
      <h6>Your Recent Reports</h6>
      <div id="recentReports">
        <p class="text-muted small">Loading...</p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="check.html"><span>🔍</span>Check</a>
    <a href="report.html" class="active"><span>📝</span>Report</a>
    <a href="insights.html"><span>📊</span>Insights</a>
    <a href="profile.html"><span>👤</span>Profile</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // --- Configuration ---
    const API_BASE = 'https://hidar.up.railway.app'; // Replace with your actual Railway URL

    // --- Helper Functions ---
    async function fetchAPI(endpoint, options = {}) {
      const token = localStorage.getItem('access_token');
      const headers = {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` }),
        ...options.headers
      };
      const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.detail || 'API request failed');
      }
      return response.json();
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.background = type === 'success' ? '#2E7D32' : '#D32F2F';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    // --- Load Crops and Markets ---
    async function loadCropsAndMarkets() {
      try {
        const crops = [
          { id: 1, name: 'Teff' },
          { id: 2, name: 'Wheat' },
          { id: 3, name: 'Maize' },
          { id: 4, name: 'Coffee' },
          { id: 5, name: 'Sesame' }
        ];
        const markets = [
          { id: 1, name: 'Adama' },
          { id: 2, name: 'Addis Ababa' },
          { id: 3, name: 'Bahir Dar' },
          { id: 4, name: 'Mekele' },
          { id: 5, name: 'Dire Dawa' },
          { id: 6, name: 'Jimma' },
          { id: 7, name: 'Shashemene' },
          { id: 8, name: 'Hawassa' },
          { id: 9, name: 'Gondar' },
          { id: 10, name: 'Dessie' }
        ];

        const cropSelect = document.getElementById('cropSelect');
        crops.forEach(crop => {
          const option = document.createElement('option');
          option.value = crop.id;
          option.textContent = crop.name;
          cropSelect.appendChild(option);
        });

        const marketSelect = document.getElementById('marketSelect');
        markets.forEach(market => {
          const option = document.createElement('option');
          option.value = market.id;
          option.textContent = market.name;
          marketSelect.appendChild(option);
        });

        // Auto-fill from URL params
        const params = new URLSearchParams(window.location.search);
        if (params.get('crop')) cropSelect.value = params.get('crop');
        if (params.get('market')) marketSelect.value = params.get('market');
        if (params.get('grade')) document.getElementById('gradeSelect').value = params.get('grade');

      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    // --- Load User Points and Recent Reports ---
    async function loadUserData() {
      const token = localStorage.getItem('access_token');
      if (!token) {
        document.getElementById('recentReports').innerHTML = `
          <p class="text-muted small">Please login to track your reports and points.</p>
          <a href="profile.html" class="btn btn-sm btn-outline-primary">Login / Register</a>
        `;
        return;
      }

      try {
        // Get user profile
        // In a real app, you'd have a /users/me endpoint
        // For now, simulate points from local storage
        const points = parseInt(localStorage.getItem('hidar_points') || '0');
        document.getElementById('pointsCount').textContent = points;

        // Get recent reports
        const reports = await fetchAPI('/reports');
        const reportsContainer = document.getElementById('recentReports');

        if (reports.length === 0) {
          reportsContainer.innerHTML = `<p class="text-muted small">No reports submitted yet.</p>`;
        } else {
          let html = '<ul class="list-group list-group-flush">';
          reports.slice(0, 5).forEach(r => {
            const statusColor = r.status === 'verified' ? 'success' : r.status === 'rejected' ? 'danger' : 'warning';
            const statusText = r.status === 'verified' ? '✅ Verified' : r.status === 'rejected' ? '❌ Rejected' : '⏳ Pending';
            html += `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                ${r.crop_name} - ${r.market_name}
                <span class="badge bg-${statusColor}">${statusText}</span>
              </li>
            `;
          });
          html += '</ul>';
          reportsContainer.innerHTML = html;
        }

      } catch (error) {
        console.error('Error loading user data:', error);
        document.getElementById('recentReports').innerHTML = `
          <p class="text-muted small">Unable to load reports. Please refresh.</p>
        `;
      }
    }

    // --- Submit Report ---
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const token = localStorage.getItem('access_token');
      if (!token) {
        if (confirm('Please login to submit price reports. Go to login page?')) {
          window.location.href = 'profile.html';
        }
        return;
      }

      const cropId = document.getElementById('cropSelect').value;
      const grade = document.getElementById('gradeSelect').value;
      const marketId = document.getElementById('marketSelect').value;
      const price = document.getElementById('priceInput').value;
      const priceType = document.querySelector('input[name="priceType"]:checked').value;
      const notes = document.getElementById('notesInput').value;

      if (!cropId || !marketId || !price) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const submitSpinner = document.getElementById('submitSpinner');

      submitText.textContent = 'Submitting...';
      submitSpinner.style.display = 'inline-block';
      submitBtn.disabled = true;

      try {
        // Get location
        let latitude = null, longitude = null;
        if (navigator.geolocation) {
          const pos = await new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
              (p) => resolve(p),
              () => resolve(null)
            );
          });
          if (pos) {
            latitude = pos.coords.latitude;
            longitude = pos.coords.longitude;
          }
        }

        const payload = {
          crop_id: parseInt(cropId),
          market_id: parseInt(marketId),
          grade: grade,
          price_etb: parseFloat(price),
          price_type: priceType,
          notes: notes || null,
          latitude: latitude,
          longitude: longitude
        };

        const result = await fetchAPI('/reports', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        // Add points
        const currentPoints = parseInt(localStorage.getItem('hidar_points') || '0');
        localStorage.setItem('hidar_points', (currentPoints + 10).toString());
        document.getElementById('pointsCount').textContent = currentPoints + 10;

        showToast('✅ Report submitted successfully! Earned 10 points.');
        this.reset();
        document.getElementById('gradeSelect').value = 'Grade 1';
        document.querySelector('input[name="priceType"][value="farmgate"]').checked = true;

        // Reload recent reports
        loadUserData();

      } catch (error) {
        console.error('Error submitting report:', error);
        showToast('❌ Failed to submit report: ' + error.message, 'error');
      } finally {
        submitText.textContent = 'Submit Report';
        submitSpinner.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    // --- Initialize ---
    document.addEventListener('DOMContentLoaded', () => {
      loadCropsAndMarkets();
      loadUserData();

      // Check if user is logged in
      const token = localStorage.getItem('access_token');
      if (token) {
        document.getElementById('userPoints').style.display = 'block';
      }
    });
  </script>
</body>
</html>
