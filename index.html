<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hidar - Market Price Intelligence</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2E7D32" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { background: #f5f5f5; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 80px; margin: 0; }
    .header { background: #2E7D32; color: white; padding: 16px; border-radius: 0 0 20px 20px; }
    .header h1 { font-size: 1.5rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .header h1 small { font-size: 0.9rem; font-weight: normal; }
    .card-price { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: none; text-align: center; cursor: pointer; transition: transform 0.15s; }
    .card-price:hover { transform: scale(1.02); }
    .price-up { color: #2E7D32; font-weight: bold; }
    .price-down { color: #D32F2F; font-weight: bold; }
    .btn-primary { background: #2E7D32; border: none; border-radius: 10px; padding: 12px; font-weight: bold; width: 100%; color: white; }
    .btn-primary:hover { background: #1B5E20; }
    .btn-outline-primary { border-color: #2E7D32; color: #2E7D32; border-radius: 10px; padding: 10px; }
    .btn-outline-primary:hover { background: #2E7D32; color: white; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; padding: 6px 0; z-index: 100; }
    .bottom-nav a { color: #757575; text-decoration: none; font-size: 0.7rem; text-align: center; flex: 1; padding: 4px 0; }
    .bottom-nav a.active { color: #2E7D32; font-weight: bold; }
    .bottom-nav span { display: block; font-size: 1.2rem; }
    .alert-banner { background: #FFF3E0; border-left: 4px solid #FFA000; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; }
    .premium-banner { background: linear-gradient(135deg, #FFA000, #FF6F00); color: white; padding: 14px; border-radius: 12px; text-align: center; margin: 16px 0; }
    .premium-banner a { color: white; font-weight: bold; text-decoration: underline; }
    .loading-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #e0e0e0; border-top: 3px solid #2E7D32; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .location-badge { background: white; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="header">
  <div class="container d-flex justify-content-between align-items-center">
    <h1>🌾 ሕዳር <small>Hidar</small></h1>
    <div>
      <button class="btn btn-sm btn-light me-1" id="langToggle">Am</button>
      <button class="btn btn-sm btn-outline-light" id="profileBtn" onclick="window.location.href='profile.html'">👤</button>
    </div>
  </div>
</div>

<div class="container mt-3">
  <div class="location-badge">
    <span>📍 <span id="userLocation">Adama</span></span>
    <small class="text-muted">Updated: <span id="lastUpdate">Loading...</span></small>
  </div>

  <div id="priceCards" class="row g-2 mb-3">
    <div class="col-12 text-center py-4"><div class="loading-spinner"></div><p class="text-muted mt-2">Loading prices...</p></div>
  </div>

  <button class="btn btn-primary" onclick="window.location.href='check.html'">🔍 View All Prices →</button>

  <div class="card p-3 mt-3">
    <div class="d-flex justify-content-between">
      <span>🔔 You have <strong id="alertCount">0</strong> active alerts</span>
      <small class="text-danger" id="alertTriggered">No triggered alerts</small>
    </div>
  </div>

  <div class="premium-banner">
    🌟 Upgrade to <strong>Premium</strong> for 7-day forecasts & market recommendations<br />
    <a href="insights.html">Learn more →</a>
  </div>

  <div id="dynamicAlert" class="alert-banner mt-2" style="display:none;">
    ⚠️ <span id="alertMessage"></span>
  </div>
</div>

<div class="bottom-nav">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="check.html"><span>🔍</span>Check</a>
  <a href="report.html"><span>📝</span>Report</a>
  <a href="insights.html"><span>📊</span>Insights</a>
  <a href="profile.html"><span>👤</span>Profile</a>
</div>

<script>
  const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'https://hidar.up.railway.app';

  async function fetchAPI(endpoint, options = {}) {
    const token = localStorage.getItem('access_token');
    const headers = { 'Content-Type': 'application/json', ...(token && { 'Authorization': `Bearer ${token}` }), ...options.headers };
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Request failed'); }
    return res.json();
  }

  async function loadDashboard() {
    const container = document.getElementById('priceCards');
    try {
      const today = new Date().toISOString().split('T')[0];
      const prices = await fetchAPI(`/prices?effective_date=${today}&limit=10`);
      if (!prices.length) {
        container.innerHTML = `<div class="col-12 text-center py-3 text-muted">No prices today. <a href="report.html">Report one!</a></div>`;
        return;
      }
      const cropMap = {};
      prices.forEach(p => { if (!cropMap[p.crop_name] || new Date(p.created_at) > new Date(cropMap[p.crop_name].created_at)) cropMap[p.crop_name] = p; });
      const crops = Object.values(cropMap).slice(0, 3);
      container.innerHTML = crops.map((p, i) => `
        <div class="col-4">
          <div class="card-price" onclick="window.location.href='check.html?crop=${p.crop_id}'">
            <strong>${p.crop_name}</strong>
            <div class="h5 mb-0">${p.price_etb.toLocaleString()}</div>
            <small class="text-muted">ብር/ቅንጥል</small>
          </div>
        </div>
      `).join('');
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      const token = localStorage.getItem('access_token');
      if (token) {
        try { const alerts = await fetchAPI('/alerts'); document.getElementById('alertCount').textContent = alerts.length; } catch(e) {}
      }
    } catch(e) {
      container.innerHTML = `<div class="col-12 text-center text-danger">⚠️ Failed to load prices. Refresh.</div>`;
    }
  }

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => document.getElementById('userLocation').textContent = `${p.coords.latitude.toFixed(2)}, ${p.coords.longitude.toFixed(2)}`,
      () => {}
    );
  }

  document.addEventListener('DOMContentLoaded', loadDashboard);
  setInterval(loadDashboard, 120000);
</script>
</body>
</html>
