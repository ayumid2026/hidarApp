<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidar - Check Price</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f5f5f5; font-family: system-ui, sans-serif; padding-bottom: 80px; }
    .header { background: #2E7D32; color: white; padding: 16px; border-radius: 0 0 20px 20px; }
    .header h1 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 10px; }
    .header a { color: white; text-decoration: none; font-size: 1.5rem; }
    .form-control, .form-select { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }
    .btn-primary { background: #2E7D32; border: none; border-radius: 10px; padding: 12px; font-weight: bold; width: 100%; color: white; }
    .btn-outline-primary { border-color: #2E7D32; color: #2E7D32; border-radius: 10px; padding: 10px; }
    .btn-outline-primary:hover { background: #2E7D32; color: white; }
    .result-card { background: white; border-radius: 12px; padding: 16px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; padding: 6px 0; z-index: 100; }
    .bottom-nav a { color: #757575; text-decoration: none; font-size: 0.7rem; text-align: center; flex: 1; padding: 4px 0; }
    .bottom-nav a.active { color: #2E7D32; font-weight: bold; }
    .bottom-nav span { display: block; font-size: 1.2rem; }
    .chart-bar { flex: 1; margin: 0 3px; background: #2E7D32; border-radius: 4px 4px 0 0; min-height: 8px; transition: height 0.3s; }
    .chart-bar-label { text-align: center; font-size: 0.55rem; color: #999; margin-top: 4px; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #e0e0e0; border-top: 3px solid #2E7D32; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <div class="container d-flex align-items-center">
    <a href="index.html">←</a>
    <h1>🔍 Check Price</h1>
  </div>
</div>

<div class="container mt-3">
  <form id="priceForm">
    <div class="mb-3">
      <label class="form-label">Crop *</label>
      <select class="form-select" id="cropSelect" required>
        <option value="">Select crop...</option>
        <option value="1">Teff</option><option value="2">Wheat</option><option value="3">Maize</option>
        <option value="4">Coffee</option><option value="5">Sesame</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Grade</label>
      <select class="form-select" id="gradeSelect" required>
        <option value="Grade 1">Grade 1</option><option value="Grade 2">Grade 2</option><option value="Mixed">Mixed</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Market *</label>
      <select class="form-select" id="marketSelect" required>
        <option value="">Select market...</option>
        <option value="1">Adama</option><option value="2">Addis Ababa</option><option value="3">Bahir Dar</option>
        <option value="4">Mekele</option><option value="5">Dire Dawa</option><option value="6">Jimma</option>
        <option value="7">Shashemene</option><option value="8">Hawassa</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary" id="searchBtn">
      <span id="searchText">Get Price</span>
      <span id="searchSpinner" class="loading-spinner" style="display:none;"></span>
    </button>
  </form>
  <div id="results" style="display:none;"></div>
</div>

<div class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="check.html" class="active"><span>🔍</span>Check</a>
  <a href="report.html"><span>📝</span>Report</a>
  <a href="insights.html"><span>📊</span>Insights</a>
  <a href="profile.html"><span>👤</span>Profile</a>
</div>

<script>
  const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'https://hidar.up.railway.app';

  async function fetchAPI(endpoint, options = {}) {
    const token = localStorage.getItem('access_token');
    const headers = { 'Content-Type': 'application/json', ...(token && { 'Authorization': `Bearer ${token}` }), ...options.headers };
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Request failed'); }
    return res.json();
  }

  document.getElementById('priceForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const crop = document.getElementById('cropSelect').value;
    const grade = document.getElementById('gradeSelect').value;
    const market = document.getElementById('marketSelect').value;
    if (!crop || !market) { alert('Please select crop and market.'); return; }

    const results = document.getElementById('results');
    const btn = document.getElementById('searchBtn');
    const text = document.getElementById('searchText');
    const spinner = document.getElementById('searchSpinner');

    text.textContent = 'Searching...'; spinner.style.display = 'inline-block'; btn.disabled = true;
    results.style.display = 'none';

    try {
      const today = new Date().toISOString().split('T')[0];
      const prices = await fetchAPI(`/prices?crop_id=${crop}&market_id=${market}&grade=${encodeURIComponent(grade)}&effective_date=${today}&limit=10`);
      const historical = await fetchAPI(`/prices?crop_id=${crop}&market_id=${market}&grade=${encodeURIComponent(grade)}&limit=7`);

      if (!prices.length) {
        results.innerHTML = `<div class="result-card text-center text-muted py-4">No prices found. <a href="report.html">Report one!</a></div>`;
        results.style.display = 'block';
        return;
      }
      const p = prices[0];
      const chartData = historical.slice(0, 7).reverse();
      const max = Math.max(...chartData.map(x => x.price_etb), p.price_etb);
      const min = Math.min(...chartData.map(x => x.price_etb), p.price_etb);
      const range = max - min || 1;

      results.innerHTML = `
        <div class="result-card">
          <div class="d-flex justify-content-between align-items-start">
            <div><h4>${p.crop_name} - ${p.grade}</h4><p class="text-muted mb-1">${p.market_name}</p>
            <span class="badge bg-secondary">${p.source}</span> ${p.verified ? '<span class="badge bg-success">Verified</span>' : ''}</div>
            <div class="text-end"><div class="h3 text-success mb-0">${p.price_etb.toLocaleString()}</div><small>ብር/ቅንጥል</small></div>
          </div>
          <div class="mt-3">
            <small class="text-muted">7-Day Trend</small>
            <div style="display:flex;align-items:flex-end;height:80px;gap:4px;padding-top:8px;">
              ${chartData.map(d => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;"><div class="chart-bar" style="height:${((d.price_etb - min) / range) * 60 + 10}px;background:${d.id === p.id ? '#FF6F00' : '#2E7D32'};"></div><div class="chart-bar-label">${new Date(d.effective_date).getDate()}</div></div>`).join('')}
            </div>
          </div>
          <div class="mt-3 row g-2">
            <div class="col-6"><button class="btn btn-outline-primary w-100" onclick="setAlert(${p.crop_id}, ${p.market_id}, '${p.grade}')">🔔 Set Alert</button></div>
            <div class="col-6"><button class="btn btn-outline-secondary w-100" onclick="window.location.href='report.html?crop=${p.crop_id}&market=${p.market_id}&grade=${p.grade}'">📝 Report</button></div>
          </div>
        </div>
      `;
      results.style.display = 'block';
      results.scrollIntoView({ behavior: 'smooth' });
    } catch(e) {
      results.innerHTML = `<div class="result-card text-danger">⚠️ Error: ${e.message}</div>`;
      results.style.display = 'block';
    } finally {
      text.textContent = 'Get Price'; spinner.style.display = 'none'; btn.disabled = false;
    }
  });

  window.setAlert = async function(cropId, marketId, grade) {
    const token = localStorage.getItem('access_token');
    if (!token) { if (confirm('Login to set alerts?')) window.location.href='profile.html'; return; }
    const threshold = prompt('Enter threshold price (ETB per quintal):');
    if (!threshold || isNaN(threshold)) return;
    try {
      await fetchAPI('/alerts', { method: 'POST', body: JSON.stringify({ crop_id: cropId, market_id: marketId, grade, condition: 'below', threshold: parseFloat(threshold), delivery_method: { sms: true, push: false } }) });
      alert('✅ Alert created!');
    } catch(e) { alert('Failed: ' + e.message); }
  };

  const params = new URLSearchParams(window.location.search);
  if (params.get('crop')) document.getElementById('cropSelect').value = params.get('crop');
</script>
</body>
</html>
